# Локальный запуск (T-504): compose подхватывает этот файл сам при `docker compose up`.
# Порты публикуются ТОЛЬКО на 127.0.0.1: наружу, в сеть, они не торчат. Ключи берутся из значений по умолчанию
# основного файла (dev-…-key, спецификация моков 3.4), .env не нужен.
#
# Отличие от облачного запуска (docker-compose.cloud.yml, задача T-507): там портов моков нет вовсе,
# а все ключи и пароли обязательны, без значений по умолчанию. При явных `-f …` этот файл не читается,
# так что облачный профиль на него не опирается.
#
# Когда появятся api и web, сюда же добавятся 127.0.0.1:8000 (Swagger api) и 127.0.0.1:8080 (интерфейс).
services:
  mock-registry:
    ports: ["127.0.0.1:8101:8000"]
  mock-tax:
    ports: ["127.0.0.1:8102:8000"]
  mock-credit-bureau:
    ports: ["127.0.0.1:8103:8000"]
  mock-bank-core:
    ports: ["127.0.0.1:8104:8000"]
  mock-scenarios:
    ports: ["127.0.0.1:8105:8000"]
  api:
    # Swagger api для разработки; жюри ходит через web (D-064)
    ports: ["127.0.0.1:8100:8000"]
