# Быстрый набор на PR и полный на main (70-08, T-509). Python-тесты с покрытием — T-510 (`tests-py`); остальные тестовые,
# контрактные, e2e и ночные задания добавляются задачами T-511…T-514; итоговая обязательная проверка — `ci-ok`.
name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  UV_PYTHON: "3.13"

jobs:
  changes:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read  # paths-filter читает список файлов PR через API
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v7.0.1
      - id: filter
        uses: dorny/paths-filter@v4.0.3
        with:
          predicate-quantifier: every
          filters: |
            code:
              - '**'
              - '!docs/plan/**'
              - '!docs/design/**'

  docs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.0
      - run: make docs-check
      - run: echo "Документы проверены" >> "$GITHUB_STEP_SUMMARY"

  lint-py:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: "**/uv.lock"
      - uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
      # make check: pre-commit, ссылки, типы, границы модулей и быстрые тесты каждого проекта
      - run: make check
      - run: echo "make check зелёный" >> "$GITHUB_STEP_SUMMARY"

  tests-py:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20  # предел быстрого набора (70-08); превышение — задача на оптимизацию
    strategy:
      fail-fast: false
      matrix:
        project: [api, mocks, nlu]
    env:
      HYPOTHESIS_PROFILE: ci  # 200 примеров на PR и main (Q-101); 2000 («deep») — ночью, T-513
    steps:
      - uses: actions/checkout@v7.0.1
      - id: has
        run: |
          if [ -f "${{ matrix.project }}/pyproject.toml" ]; then echo "project=true" >> "$GITHUB_OUTPUT"; else echo "Проекта ${{ matrix.project }} ещё нет" >> "$GITHUB_STEP_SUMMARY"; fi
      - if: steps.has.outputs.project == 'true'
        uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: "${{ matrix.project }}/uv.lock"
      # unit + property + integration (Postgres/Redis через Testcontainers, Docker есть на раннере) с покрытием;
      # порог покрытия задан в pyproject.toml проекта, не флагом
      - if: steps.has.outputs.project == 'true'
        run: make -C ${{ matrix.project }} test
      - if: always() && steps.has.outputs.project == 'true'
        run: |
          {
            echo "### Покрытие: ${{ matrix.project }}"
            make --no-print-directory -C ${{ matrix.project }} coverage-md
          } >> "$GITHUB_STEP_SUMMARY"
      - if: always() && steps.has.outputs.project == 'true'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: tests-${{ matrix.project }}
          path: ${{ matrix.project }}/reports/
          if-no-files-found: ignore
          retention-days: 14

  build:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        service: [api, mocks, web, nlu]
    steps:
      - uses: actions/checkout@v7.0.1
      - id: has
        run: |
          if [ -f "${{ matrix.service }}/Dockerfile" ]; then echo "dockerfile=true" >> "$GITHUB_OUTPUT"; else echo "Образа ${{ matrix.service }} ещё нет" >> "$GITHUB_STEP_SUMMARY"; fi
      - if: steps.has.outputs.dockerfile == 'true'
        uses: docker/setup-buildx-action@v4.4.1
      - if: steps.has.outputs.dockerfile == 'true'
        uses: docker/build-push-action@v7.4.0
        with:
          context: ${{ matrix.service }}
          push: false
          tags: scc-${{ matrix.service }}:ci
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  ci-ok:
    if: always()
    needs: [changes, docs, lint-py, tests-py, build]
    runs-on: ubuntu-24.04
    steps:
      - uses: re-actors/alls-green@v1.3.0
        with:
          allowed-skips: lint-py, tests-py, build
          jobs: ${{ toJSON(needs) }}
