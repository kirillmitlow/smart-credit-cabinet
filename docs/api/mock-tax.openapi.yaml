              "NON_SUBMISSION_OF_DECLARATION",
              "TAX_DEBT_COLLECTION",
              "OTHER"
            ],
            "title": "Reason"
          },
          "liftedAt": {
            "anyOf": [
              {
                "type": "string",
                "format": "date"
              },
              {
                "type": "null"
              }
            ],
            "title": "Liftedat"
          }
        },
        "additionalProperties": false,
        "type": "object",
        "required": [
          "number",
          "date",
          "taxAuthorityCode",
          "bik",
          "reason"
        ],
        "title": "AccountBlockRecord"
      },
