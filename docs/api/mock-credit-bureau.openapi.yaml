    "/api/v1/submissions": {
      "post": {
        "tags": [
          "mock-credit-bureau"
        ],
        "summary": "Банк передаёт сведения в БКИ",
        "description": "События `APPLICATION_REGISTERED`, `APPLICATION_DECIDED`, `OBLIGATION_OPENED`, `OBLIGATION_CLOSED`. `Idempotency-Key` обязателен. Повтор события с тем же `eventId` (в том числе с другим ключом) возвращает исходный `202` с тем же `submissionId`; другое тело при том же `eventId` — `409 IDEMPOTENCY_KEY_REUSED`.",
        "operationId": "submitToBureau",
        "security": [
          {
            "ApiKeyAuth": []
          },
          {
            "AdminKeyAuth": []
          }
        ],
        "parameters": [
          {
            "name": "Idempotency-Key",
            "in": "header",
            "required": false,
            "schema": {
              "anyOf": [
                {
                  "type": "string",
                  "minLength": 1,
                  "maxLength": 200
                },
                {
                  "type": "null"
                }
              ],
              "description": "Обязателен",
              "title": "Idempotency-Key"
            },
            "description": "Обязателен"
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "oneOf": [
                  {
                    "$ref": "#/components/schemas/ApplicationRegistered"
                  },
                  {
                    "$ref": "#/components/schemas/ApplicationDecided"
                  },
                  {
                    "$ref": "#/components/schemas/ObligationOpened"
                  },
                  {
                    "$ref": "#/components/schemas/ObligationClosed"
                  }
                ],
                "discriminator": {
                  "propertyName": "eventType",
                  "mapping": {
                    "APPLICATION_REGISTERED": "#/components/schemas/ApplicationRegistered",
                    "APPLICATION_DECIDED": "#/components/schemas/ApplicationDecided",
                    "OBLIGATION_OPENED": "#/components/schemas/ObligationOpened",
                    "OBLIGATION_CLOSED": "#/components/schemas/ObligationClosed"
                  }
                },
                "title": "Event"
              }
            }
          }
        },
        "responses": {
