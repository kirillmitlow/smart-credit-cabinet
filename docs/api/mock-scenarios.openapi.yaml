  "components": {
    "schemas": {
      "ActiveLoan": {
        "properties": {
          "kind": {
            "type": "string",
            "enum": [
              "LOAN",
              "CREDIT_LINE",
              "OVERDRAFT",
              "CREDIT_CARD",
              "LEASING",
              "MICROLOAN",
              "CONSUMER_LOAN"
            ],
            "title": "Kind"
          },
          "amountRub": {
            "anyOf": [
              {
                "type": "integer",
                "exclusiveMinimum": 0.0
              },
              {
                "type": "null"
              }
            ],
            "title": "Amountrub"
          },
          "termMonths": {
            "anyOf": [
              {
                "type": "integer",
                "minimum": 1.0
              },
              {
                "type": "null"
              }
            ],
            "title": "Termmonths"
          },
          "limitRub": {
            "anyOf": [
              {
                "type": "integer",
                "exclusiveMinimum": 0.0
              },
              {
                "type": "null"
              }
            ],
            "title": "Limitrub"
          },
          "balanceRub": {
            "anyOf": [
              {
                "type": "integer",
                "minimum": 0.0
              },
              {
                "type": "null"
              }
            ],
            "title": "Balancerub"
          },
          "ratePercent": {
            "anyOf": [
              {
                "type": "number",
                "maximum": 200.0,
                "minimum": 0.0
              },
              {
                "type": "null"
              }
            ],
            "title": "Ratepercent"
          },
          "monthlyPaymentRub": {
            "anyOf": [
              {
                "type": "integer",
                "minimum": 0.0
              },
              {
                "type": "null"
              }
            ],
            "title": "Monthlypaymentrub"
          },
          "openedAt": {
            "anyOf": [
              {
                "type": "string"
              },
              {
                "type": "null"
              }
            ],
            "title": "Openedat"
          },
          "secured": {
            "anyOf": [
              {
                "type": "boolean"
              },
              {
                "type": "null"
              }
            ],
            "title": "Secured"
          },
          "ourBank": {
            "anyOf": [
              {
                "type": "boolean"
              },
              {
                "type": "null"
              }
            ],
            "title": "Ourbank"
          }
        },
        "additionalProperties": false,
        "type": "object",
        "required": [
          "kind"
        ],
