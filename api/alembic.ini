# Миграции api. Путь к скриптам и строку подключения задаёт app/shared/db.py (alembic_config);
# из командной строки: `DATABASE_URL=... uv run alembic revision --autogenerate -m "..."`.
[alembic]
script_location = %(here)s/alembic
file_template = %%(rev)s_%%(slug)s
prepend_sys_path = .
path_separator = os

[loggers]
keys = root

[handlers]
keys =

[formatters]
keys =

[logger_root]
level = WARNING
handlers =
