# Политика решения v1 (30-13). Все числа синтетические, демо-допущения, не реальная политика банка.
# Правила файла:
#   * у каждого узла с числами есть source (номер в 30-18, раздел 30-NN/10-NN, решение D-NNN
#     или «допущение: …») и note (короткий комментарий) — без них схема файл не принимает;
#   * доли и ставки — строки ("0.24"), не float; деньги — целые рубли;
#   * слово NO в YAML — булево значение, поэтому «нет доступа» всегда пишем в кавычках;
#   * менять число в существующем файле нельзя: любая правка параметра — новый файл v2 (30-13).
