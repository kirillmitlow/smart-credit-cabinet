wizard:
  collateral_question_above_rub:
    value: 10000000
    source: "10-06"
    note: "вопрос о залоге задаём, только если сумма выше наименьшего порога залога в каталоге (оборотный, 10 млн)"
  default_term_months:
    value: 12
    source: "допущение: срок для предварительной проверки продукта, если клиент его ещё не назвал"
    note: "подгоняется в границы срока продукта"
  comfortable_terms_months: [12, 24, 36]
  rules:
    - id: START_PATH
      source: "10-07"
      note: "бизнесу моложе 6 мес.: путь «На запуск», продукт только с поручительством или залогом, ручное рассмотрение (D-035, D-077)"
      when: {young_business: true}
      primary: EXPRESS
      start_path: true
      why: "Бизнесу до 6 месяцев кредит доступен с поручительством владельца или залогом; заявку посмотрит специалист"
    - id: EQUIPMENT_SMALL
      source: "10-07"
      note: "оборудование, сумма до 3 млн: экспресс, альтернатива инвестиционный"
      when: {purpose: [EQUIPMENT], amount_max_rub: 3000000}
      primary: EXPRESS
      alternatives: [INVESTMENT]
      why: "Небольшая сумма на оборудование: быстро и без залога"
    - id: EQUIPMENT_LARGE
      source: "10-07"
      note: "оборудование, сумма больше 3 млн: инвестиционный"
      when: {purpose: [EQUIPMENT], amount_above_rub: 3000000}
      primary: INVESTMENT
      why: "Покупка оборудования или транспорта на крупную сумму: длинный срок, оборудование остаётся в залоге"
    - id: EQUIPMENT_AMOUNT_UNKNOWN
      source: "допущение: в таблице 10-07 нет строки для «сумму не знаю»; подбираем как для крупной суммы"
      note: "оборудование без названной суммы"
      when: {purpose: [EQUIPMENT]}
      primary: INVESTMENT
      alternatives: [EXPRESS]
      why: "Оборудование или транспорт: длинный срок и платёж по силам"
    - id: GOODS_ONCE
      source: "10-07"
      note: "товар, разово: оборотный, альтернатива экспресс (если сумма до 3 млн, отсеет проверка границ)"
      when: {purpose: [GOODS], frequency: [ONCE]}
      primary: WORKING_CAPITAL
      alternatives: [EXPRESS]
      why: "Разовая закупка товара или сырья"
    - id: GOODS_REGULAR
      source: "10-07"
      note: "товар, регулярно: кредитная линия, альтернатива оборотный"
      when: {purpose: [GOODS], frequency: [REGULAR]}
      primary: CREDIT_LINE
      alternatives: [WORKING_CAPITAL]
      why: "Закупки повторяются: линию можно брать и возвращать в пределах лимита"
    - id: GOODS_FREQUENCY_UNKNOWN
      source: "допущение: в таблице 10-07 нет строки для «не знаю» про регулярность; берём разовый случай"
      note: "товар без ответа про регулярность"
      when: {purpose: [GOODS]}
      primary: WORKING_CAPITAL
      alternatives: [EXPRESS]
      why: "Закупка товара или сырья"
    - id: ORDER_GOV
      source: "10-07"
      note: "заказ с оплатой позже, госзаказ: кредит под контракт, альтернатива оборотный"
      when: {purpose: [ORDER], gov_contract: true}
      primary: CONTRACT
      alternatives: [WORKING_CAPITAL]
      why: "Госзаказ: кредит привязан к контракту и закрывается, когда заказчик заплатит"
    - id: ORDER_REGULAR
      source: "10-07"
      note: "заказы регулярно: кредитная линия, альтернатива под контракт"
      when: {purpose: [ORDER], frequency: [REGULAR]}
      primary: CREDIT_LINE
      alternatives: [CONTRACT]
      why: "Заказы повторяются: линия закрывает паузу до оплаты от клиентов"
    - id: ORDER_ANY
      source: "допущение: в таблице 10-07 нет строки для разового негосударственного заказа; берём кредит под контракт"
      note: "заказ с оплатой позже без госзаказа и регулярности"
      when: {purpose: [ORDER]}
      primary: CONTRACT
      alternatives: [WORKING_CAPITAL]
      why: "Заказ, за который заплатят позже: кредит под контракт"
    - id: GAP_DAYS_CLIENT
      source: "10-07"
      note: "нехватка на дни, клиент банка: овердрафт, альтернатива экспресс; если оборотов меньше 6 мес., овердрафт отсеет проверка требований продукта"
      when: {purpose: [GAP], payback_horizon: [DAYS], client: true}
      primary: OVERDRAFT
      alternatives: [EXPRESS]
      future_hint: OVERDRAFT
      why: "Нехватка денег на несколько дней: овердрафт гасится поступлениями на счёт"
    - id: GAP_DAYS_NOT_CLIENT
      source: "10-07"
      note: "нехватка на дни, не клиент банка: экспресс и подсказка, когда станет доступен овердрафт"
      when: {purpose: [GAP], payback_horizon: [DAYS], client: false}
      primary: EXPRESS
      future_hint: OVERDRAFT
      why: "Нехватка денег на несколько дней: подойдёт экспресс-кредит"
    - id: GAP_WEEKS_REGULAR
      source: "10-07"
      note: "нехватка на недели, часто: кредитная линия, альтернатива экспресс"
      when: {purpose: [GAP], payback_horizon: [WEEKS], frequency: [REGULAR]}
      primary: CREDIT_LINE
      alternatives: [EXPRESS]
      why: "Нехватка повторяется: линия под рукой, проценты только за использованное"
    - id: GAP_ANY
      source: "допущение: в таблице 10-07 нет строк для остальных сочетаний срока и частоты нехватки денег"
      note: "нехватка денег остальных видов: экспресс, альтернатива оборотный"
      when: {purpose: [GAP]}
      primary: EXPRESS
      alternatives: [WORKING_CAPITAL]
      why: "Временная нехватка денег: быстрый кредит без залога"
    - id: GROWTH_SMALL
      source: "10-07"
      note: "развитие, сумма до 3 млн: экспресс, альтернатива оборотный"
      when: {purpose: [GROWTH], amount_max_rub: 3000000}
      primary: EXPRESS
      alternatives: [WORKING_CAPITAL]
      why: "Небольшая сумма на развитие: быстро и без залога"
    - id: GROWTH_LONG
      source: "10-07"
      note: "развитие, сумма больше 3 млн, окупается дольше года: инвестиционный"
      when: {purpose: [GROWTH], amount_above_rub: 3000000, payback_horizon: [OVER_YEAR]}
      primary: INVESTMENT
      why: "Развитие, которое окупится не сразу: длинный срок"
    - id: GROWTH_LARGE
      source: "10-07, допущение: «не знаю» про срок окупаемости считаем коротким, чтобы не требовать залог"
      note: "развитие, сумма больше 3 млн, окупается быстрее: оборотный"
      when: {purpose: [GROWTH], amount_above_rub: 3000000}
      primary: WORKING_CAPITAL
      why: "Развитие, которое окупится в ближайший год"
    - id: GROWTH_AMOUNT_UNKNOWN
      source: "допущение: в таблице 10-07 нет строки для «сумму не знаю»"
      note: "развитие без названной суммы"
      when: {purpose: [GROWTH]}
      primary: WORKING_CAPITAL
      alternatives: [EXPRESS]
      why: "Развитие бизнеса: платёж по силам, срок на выбор"
    - id: OTHER
      source: "10-07"
      note: "другое: экспресс; если сумма больше 3 млн, проверка границ не пропустит, и клиент увидит каталог с подсказкой"
      when: {purpose: [OTHER]}
      primary: EXPRESS
      why: "Небольшая сумма на любые цели"

eligibility:
  self_employed:
    enabled: true
    source: "30-01"
    note: "самозанятый (НПД) не клиент кредита для бизнеса → NOT_ELIGIBLE"

stop_factors:
  company_not_active:
    enabled: true
    source: "30-04"
    note: "статусы реестра, при которых компания не действует; REORGANIZING не стоп (автомат не уверен)"
    legal_entity_statuses: [LIQUIDATING, LIQUIDATED, BANKRUPT]
    entrepreneur_statuses: [CEASED, BANKRUPT]
  aml_list:
    enabled: true
    source: "30-04"
    note: "совпадение компании, директора или учредителя со списком"
  bankruptcy:
    enabled: true
    source: "D-035"
    note: "дело не завершено или завершено менее 60 мес. назад; доля учредителя ≥ 25% (115-ФЗ, допущение 30-04)"
    window_months: 60
    founder_share_percent: "25"
  forbidden_industry:
    enabled: true
    source: "допущение: перечень типичных ограничений банков (30-04)"
    note: "азартные игры 92, оружие 25.4, займы 64.92; совпадение по целым сегментам кода"
    okved_prefixes: ["92", "25.4", "64.92"]
  duplicate_application:
    enabled: true
    source: "30-04"
    note: "вторая заявка компании в работе; защита от гонки двух отправок"
  tax_arrears_high:
    enabled: true
    source: "D-035"
    note: "налоговый долг больше 10% осторожной месячной выручки (пени и штрафы не считаются)"
    max_ratio: "0.10"
  current_overdue_90:
    enabled: true
    source: "30-18 №4"
    note: "определение дефолта 90+ дней (483-П п. 13.3, Базель CRE36.68), берём ≥ 90; существенность 10 000 ₽ — допущение"
    days: 90
    min_rub: 10000

flags:
  mass_registration:
    enabled: true
    source: "30-04"
    note: "массовый адрес, руководитель или учредитель по «Прозрачному бизнесу» ФНС: только флаг, отказа нет"
  overdue_30_89:
    enabled: true
    source: "30-04"
    note: "текущая просрочка от 30 дней до порога стопа CURRENT_OVERDUE_90 (89 дней), сумма не меньше 10 000 ₽ (допущение: ниже техническая просрочка, 30-02); верхняя граница берётся из стопа, чтобы между флагом и стопом не было дня-щели"
    min_days: 30
    min_rub: 10000
  data_mismatch:
    turnover_vs_financials:
      enabled: true
      source: "D-035"
      note: "обороты за календарный год без НДС против строки 2110 за тот же год; расхождение больше 30% от отчётности, год берётся только целиком из окна оборотов (30-02)"
      max_share: "0.30"
    declared_vs_calculated:
      enabled: true
      source: "D-035"
      note: "заявленная выручка в месяц против осторожной расчётной; расхождение больше 30% от расчётной (30-02)"
      max_share: "0.30"
    statement_vs_financials:
      enabled: true
      source: "D-035"
      note: "выписка клиента против отчётности за общий календарный год; расхождение больше 30% от отчётности (30-02)"
      max_share: "0.30"
    flow_crosscheck:
      enabled: true
      source: "допущение: порог мягче выручечных сверок, потому что поток по счёту шумнее выручки (30-03, 30-02)"
      note: "поток по счёту против потока модели: отношение ниже 0,5"
      min_ratio: "0.5"
    director_vs_registry:
      enabled: true
      source: "30-04"
      note: "директор в анкете не совпал с директором по реестру после нормализации ФИО (30-02)"
  turnover_anomaly:
    pump:
      enabled: true
      source: "D-076"
      note: "накачка: среднее последних 3 мес. к медиане 9 мес. до них не меньше 1,6 и модифицированный z не меньше 3,5 (Iglewicz, Hoaglin 1993); 1,6 — допущение, уточняется на синтетике (30-14); нужен ряд не короче 12 мес."
      recent_months: 3
      base_months: 9
      min_ratio: "1.6"
      min_modified_z: "3.5"
      modified_z_constant: "0.6745"
      mad_fallback_share: "0.05"
      seasonal_min_months: 24
      seasonal_repeat_ratio: "1.3"
    transit:
      enabled: true
      source: "D-076"
      note: "транзит: не меньше 9 из последних 12 мес., где списания не меньше 98,5% поступлений (допущение, 30-02); у торговли с маржой 5% доля около 0,96, ложных срабатываний нет"
      window_months: 12
      min_outgoing_share: "0.985"
      min_months: 9
    single_payer:
      enabled: true
      source: "D-076"
      note: "один плательщик: не больше 2 контрагентов в каждом из последних 6 мес. при средних поступлениях не меньше 3 млн ₽ в месяц (допущение, 30-02); только по оборотам нашего банка, у выписки контрагентов нет"
      window_months: 6
      max_payers: 2
      min_avg_income_rub: 3000000
      exempt_okved_prefixes: ["47", "55", "56", "96"]

restrictions:
  business_too_young:
    value: 6
    source: "D-035"
    note: "возраст бизнеса меньше 6 мес. — только с обеспечением; сильнее колонок каталога (D-077)"

features:
  vat:
    regime_code: OSNO
    source: "30-18 №7"
    note: "НДС 20% до 31.12.2025, 22% с 01.01.2026 (425-ФЗ); только режим ОСНО"
    schedule:
      - {since: "2000-01-01", rate: "0.20"}
      - {since: "2026-01-01", rate: "0.22"}
  industry:
    source: "30-18 №5, D-079"
    note: "маржа отрасли по первым двум цифрам ОКВЭД (ФНС за 2025 с поправкой на выручку); строительства в статистике нет — как производство"
    default_group: SERVICES
    margins: {TRADE: "0.05", FOOD: "0.10", MANUFACTURING: "0.12", IT: "0.15", AGRO: "0.15", SERVICES: "0.13"}
    ranges:
      - {group: AGRO, from_prefix: 1, to_prefix: 3}
