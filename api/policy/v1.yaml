    margins: {TRADE: "0.05", FOOD: "0.10", MANUFACTURING: "0.12", IT: "0.15", AGRO: "0.15", SERVICES: "0.13"}
    ranges:
      - {group: AGRO, from_prefix: 1, to_prefix: 3}
