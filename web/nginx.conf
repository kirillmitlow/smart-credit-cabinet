# web = nginx: статика SPA и прокси `/api` в api (T-401, 50-01, 50-11, 50-09).
# Один origin для интерфейса и API: CORS не нужен, cookie сессии идут сами.
# Образ nginx-unprivileged слушает 8080 без прав root; этот файл лежит в /etc/nginx/conf.d/ (контекст http).

# Сквозной номер запроса: берём присланный браузером или заводим свой
map $http_x_request_id $request_id_out {
    default $http_x_request_id;
    ""      $request_id;
}

# Docker DNS: адрес api пересчитывается, если контейнер пересоздали (`up -d --build api`)
resolver 127.0.0.11 valid=10s ipv6=off;

server_tokens off;

gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_types text/plain text/css application/javascript application/json image/svg+xml;

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Загрузка выписок и документов: до 10 МБ на файл (50-12), с запасом на форму
    client_max_body_size 12m;

    set $api_upstream http://api:8000;

    # --- Интерфейс (SPA) ---

    # Любой адрес SPA (/bank, /demo, /applications/…) отдаёт тот же index.html
    location / {
        try_files $uri /index.html;
        include /etc/nginx/snippets/security-headers.conf;
        include /etc/nginx/snippets/csp-spa.conf;
        add_header Cache-Control "no-cache" always;
    }

    # Статика с хешем в имени: кэшируем на год. Промах — честный 404, а не index.html вместо скрипта
    location /assets/ {
        try_files $uri =404;
        include /etc/nginx/snippets/security-headers.conf;
        include /etc/nginx/snippets/csp-spa.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location = /favicon.svg {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=86400" always;
    }

    # Проверка готовности для docker compose
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # api отдаёт ручки с корня (`/me`, `/auth/…`, `/health/…`), а снаружи они живут под `/api/`:
    # префикс срезается здесь, наружу api отдельно не публикуется. Сегмент `v1` (50-07) тоже допустим.

    # --- SSE: один поток на вкладку, без буферизации (50-11) ---
    location ~ ^/api/(v1/)?events/ {
        rewrite ^/api/(v1/)?(.*)$ /$2 break;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id_out;
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        add_header X-Accel-Buffering "no" always;
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/security-headers.conf;
        include /etc/nginx/snippets/csp-api.conf;
        error_page 502 504 = @api_down;
    }

    # Swagger UI тянет скрипты со своего CDN и использует встроенные скрипты: строгий CSP интерфейса сюда не добавляем
    location ~ ^/(docs|openapi\.json)$ {
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Request-Id $request_id_out;
        include /etc/nginx/snippets/security-headers.conf;
        error_page 502 504 = @api_down;
    }

    # --- Остальной API ---
    location /api/ {
        rewrite ^/api/(v1/)?(.*)$ /$2 break;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id_out;
        proxy_read_timeout 60s;
        include /etc/nginx/snippets/security-headers.conf;
        include /etc/nginx/snippets/csp-api.conf;
        error_page 502 504 = @api_down;
    }

    # api недоступен: отвечаем тем же форматом problem+json, что и сам api (50-07)
    location @api_down {
        default_type application/problem+json;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Retry-After "5" always;
        return 503 '{"type":"about:blank","title":"Service Unavailable","status":503,"code":"SERVICE_UNAVAILABLE","detail":"api is unavailable","requestId":"$request_id_out"}';
    }
}
