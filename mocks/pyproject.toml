[project]
name = "scc-mocks"
version = "0.1.0"
description = "Моки внешних систем для «Умного кредитного кабинета» (docs/specs/mocks.md)"
requires-python = ">=3.13,<3.14"
dependencies = [
    "alembic>=1.20.0",
    "asyncpg>=0.32.0",
    "fastapi>=0.157.0",
    "httpx>=0.28.1",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.1",
    "sqlalchemy[asyncio]>=2.1.5",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "asgi-lifespan>=2.1.0",
    "hypothesis>=6.170.5",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "testcontainers[postgres]>=4.15.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q --strict-markers"
markers = ["integration: нужен живой Postgres (Testcontainers или DATABASE_URL)"]

# Покрытие измеряет `make test` (флаг --cov); `make check` гоняет часть тестов и порог не проверяет.
# Порог 70% для не-ядра (D-087); его проверяет и pytest-cov (из fail_under), и `coverage report`.
[tool.coverage.run]
source = ["app"]
branch = true
omit = [
    "app/roles/*/migrations/versions/*",  # миграции Alembic проверяются интеграционными тестами
    "*/__init__.py",
]

[tool.coverage.report]
fail_under = 70
show_missing = true
skip_covered = true
exclude_also = [
    "if TYPE_CHECKING:",
]

[tool.mypy]
python_version = "3.13"
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
