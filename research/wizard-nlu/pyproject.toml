[project]
name = "wizard-nlu-research"
version = "0.1.0"
requires-python = ">=3.11,<3.14"
dependencies = [
  "torch==2.8.0",
  "transformers==4.57.1",
  "numpy==2.2.6",
  "scipy==1.16.2",
  "scikit-learn==1.7.2",
  "psutil==7.1.0",
  "sentencepiece==0.2.1",
  "protobuf==6.32.1",
  "huggingface-hub==0.35.3",
  "safetensors==0.6.2",
  "accelerate==1.10.1",
  "laya==0.4.12",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux' or sys_platform == 'win32'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
